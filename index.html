<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Task Manager</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Flatpickr for explicit Calendar/Time -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Header -->
        <header class="header">
            <div class="header-left">
                <h1>All tasks</h1>
                <span id="task-count" class="task-count">0 tasks</span>
            </div>
            <div class="header-right">
                <div class="search-container">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="search-input" placeholder="Search">
                </div>
                <div class="sort-container">
                    <select id="sort-select">
                        <option value="newest">Newest</option>
                        <option value="oldest">Oldest</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Add Task Input Area -->
            <form id="task-form" class="task-input-container">
                <div class="input-wrapper">
                    <i class="fa-solid fa-plus input-icon"></i>
                    <input type="text" id="task-input" placeholder="Add a task... or type '!high', 'tomorrow', '@work'" autocomplete="off">
                </div>
                <div class="input-actions">
                    <input type="text" id="date-picker" class="hidden-picker" placeholder="Date">
                    <button type="button" class="action-icon-btn" id="btn-calendar" title="Set Date & Time">
                        <i class="fa-regular fa-calendar"></i>
                    </button>
                    <button type="submit" class="btn-add">Add</button>
                </div>
            </form>

            <!-- Task List -->
            <div class="task-list" id="task-list">
                <!-- Tasks will be dynamically injected here -->
            </div>
        </main>

        <!-- Keyboard Shortcuts Legend -->
        <footer class="shortcuts-legend">
            <div class="shortcut"><kbd>N</kbd> new task</div>
            <div class="shortcut"><kbd>/</kbd> search</div>
            <div class="shortcut"><kbd>Esc</kbd> close or cancel</div>
        </footer>
    </div>

    <!-- Edit Task Modal (Hidden by Default) -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Edit Task</h3>
            <input type="text" id="edit-input" class="edit-input">
            <div class="modal-actions">
                <button type="button" id="cancel-edit" class="btn-secondary">Cancel</button>
                <button type="button" id="save-edit" class="btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
